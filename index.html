<!doctype html>
<html lang="ms">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Surau Ar-Raudhah Eristana</title>
	<!-- Supabase browser client -->
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<!-- Portal presentation rules are maintained separately for easier updates and browser caching. -->
	<link rel="stylesheet" href="styles_portal.css">
</head>
	
<body>
<!--Main Header-->
	<header class="header">
		<div class="top">
			<img class="logo" src="logo.png" alt="Logo" onerror="this.style.visibility='hidden'">
			<div class="identity">
				<h1>SURAU AR-RAUDHAH ERISTANA</h1>
				<p>No.1, Eristana, Persiaran Seri Pristana 1, Seri Pristana, 47000 Sungai Buloh, Selangor · JAI.SEL.BPM/01/037/197</p>
			</div>
			<div class="actions">
				<button class="icon" onclick="fontSize(-1)">A−</button>
				<button class="icon" onclick="fontSize(1)">A+</button>
				<button class="icon" onclick="toggleMode()" title="Mod terang/gelap">◐</button>
				<button class="icon" id="fullscreenBtn" onclick="toggleFullscreen()" title="Skrin penuh">⛶</button>
				<button class="icon" onclick="togglePageMenu()" title="Sembunyi/Papar Menu">☰</button>
				<button class="icon" onclick="openAdmin()">⚙</button>
			</div>
		</div>
		<nav class="nav" id="nav"></nav>
	</header>
	<main class="wrap" id="content"></main>

<!--Main Footer-->
	<div class="bottom-bar" id="bottomBar">
		<div class="marquee" id="marquee">
			<b>📢 PENGUMUMAN</b>
			<span id="marqueeText">Selamat datang ke Surau Ar-Raudhah Eristana.</span>
		</div>
		<a class="facebook-box" href="https://facebook.com/surauarraudhaheristana" target="_blank" rel="noopener noreferrer" aria-label="Facebook Rasmi Surau Ar-Raudhah Eristana">
		<b>f&nbsp; FACEBOOK RASMI</b>
		</a>
	</div>

	<div id="pdfViewerModal" class="pdf-modal hidden" role="dialog" aria-modal="true" aria-labelledby="pdfViewerTitle">
		<div class="pdf-box">
			<div class="pdf-head"><h2 id="pdfViewerTitle">Dokumen</h2>
				<div class="pdf-actions">
					<button class="btn secondary" id="pdfDownloadBtn" onclick="downloadCurrentPdf()"><span class="label">Muat Turun</span> ⇩</button>
					<button class="icon" onclick="closePdfViewer()" aria-label="Tutup paparan PDF">✕</button>
				</div>
			</div>
			<div style="position:relative;min-height:0">
				<div id="pdfLoading" class="pdf-loading">Memuatkan dokumen…</div>
				<iframe id="pdfFrame" class="pdf-frame" title="Paparan PDF" onload="pdfLoaded()"></iframe>
			</div>
		</div>
	</div>
	
	<div id="adminModal" class="modal hidden">
		<div class="modal-box">
			<div class="modal-head">
				<h2>⚙ Pentadbiran Portal</h2>
				<button class="icon" onclick="closeAdmin()">✕</button>
			</div>
			<div class="modal-body" id="adminBody"></div>
		</div>
	</div>
	
	<div class="statusline" id="toast"></div>

<!-- Configuration must load before the portal application logic. -->
<script src="config_portal.js"></script>
<!-- Main portal rendering, user functions, and administration functions. -->
<script src="app_portal.js"></script>
</body></html>
