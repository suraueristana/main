function populate(){let x=S.org.find(x=>x.position_name===role.value)||{};name.value=x.person_name||'';house.value=x.house||'';phone.value=x.phone||'';task.value=x.task_description||'';current.innerHTML=photo(x)?`<img src="${photo(x)}" style="width:100px;height:100px;border-radius:50%;object-fit:cover">`:''}
function cropOpen(f){if(!f)return;let i=new Image;i.onload=()=>{crop={img:i,z:1,x:0,y:0};cropBox.classList.remove('hidden');draw();drag()};i.src=URL.createObjectURL(f)}function draw(){if(!crop.img)return;let c=canvas,g=c.getContext('2d'),sc=Math.max(500/crop.img.width,500/crop.img.height)*crop.z,w=crop.img.width*sc,h=crop.img.height*sc;g.clearRect(0,0,500,500);g.drawImage(crop.img,(500-w)/2+crop.x,(500-h)/2+crop.y,w,h)}function drag(){let d=false,x,y;canvas.onpointerdown=e=>{d=true;x=e.clientX;y=e.clientY};canvas.onpointermove=e=>{if(!d)return;let r=500/canvas.getBoundingClientRect().width;crop.x+=(e.clientX-x)*r;crop.y+=(e.clientY-y)*r;x=e.clientX;y=e.clientY;draw()};canvas.onpointerup=()=>d=false}
async function saveOrg(){if(!role.value)return alert('Pilih jawatan');let old=S.org.find(x=>x.position_name===role.value),path=old?.photo_path||null;if(crop.img){let blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.9)),n=role.value.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now()+'.jpg',u=await sb.storage.from('organization-photos').upload(n,blob,{contentType:'image/jpeg'});if(u.error)return alert(u.error.message);path=n;if(old?.photo_path)await sb.storage.from('organization-photos').remove([old.photo_path])}let row={position_code:role.value.toLowerCase().replace(/[^a-z0-9]+/g,'-'),position_name:role.value,person_name:name.value,house:house.value,phone:phone.value,task_description:task.value,photo_path:path,active:true,updated_by:S.user.id},r=old?await sb.from('organization_members').update(row).eq('id',old.id):await sb.from('organization_members').insert(row);if(r.error)return alert(r.error.message);S.org=await get('organization_members','position_order');populate();alert('Disimpan')}
setInterval(()=>S.page==='home'&&render(),1000);setInterval(()=>{S.slide++;S.page==='home'&&render()},10000);load();prayers();['announcements','islamic_events','organization_members','media_items','funds','page_settings'].forEach(t=>sb.channel(t).on('postgres_changes',{event:'*',schema:'public',table:t},load).subscribe());
