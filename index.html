muted{color:var(--muted)}.gold{color:var(--accent)}.section{padding:15px}.section h3{margin:0 0 10px}.prayer{display:flex;justify-content:space-between;padding:8px 11px;margin:4px 0;border-radius:10px;background:#ffffff08}.prayer.current{background:var(--primary);color:#fff}.prayer.next{outline:1px solid var(--accent)}.count{padding:10px;text-align:center;border:1px solid #f4c95d66;border-radius:11px;color:var(--accent);font-weight:800}.event{display:flex;justify-content:space-between;padding:10px;background:#ffffff08;border-radius:10px;margin-top:7px}.media{min-height:520px;background:#000;display:grid;place-items:center;overflow:hidden;position:relative}.media img,.media video{width:100%;height:100%;max-height:calc(100vh - 180px);object-fit:contain}.caption{position:absolute;left:18px;right:18px;bottom:18px;background:#000a;padding:10px 14px;border-radius:10px}.marquee{position:fixed;left:0;right:0;bottom:0;height:54px;z-index:25;background:var(--primary);display:flex;align-items:center;overflow:hidden}.marquee b{height:100%;display:flex;align-items:center;padding:0 18px;background:var(--accent);color:#17271f;z-index:2;white-space:nowrap}.marquee span{display:inline-block;white-space:nowrap;font-weight:800;padding-left:100%;animation:mq var(--marquee) linear infinite}@keyframes mq{to{transform:translateX(-100%)}}.page-title{margin:4px 0 20px}.page-title h2{font-size:2rem;margin:0}.grid{display:grid;gap:14px}.grid4{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}.tile{padding:20px}.tile strong{font-size:1.6rem;color:var(--primary)}.search-box{max-width:900px;margin:auto;padding:20px}.form-row{display:grid;grid-template-columns:1fr auto;gap:10px}.input{width:100%;border:1px solid var(--border);border-radius:11px;background:#ffffff0b;color:var(--text);padding:12px}.btn{border:0;border-radius:11px;background:var(--primary);color:#fff;font-weight:800;padding:11px 16px;cursor:pointer}.btn.secondary{background:#ffffff12;color:var(--text);border:1px solid var(--border)}.btn.danger{background:#dc2626}.membership{max-width:900px;margin:20px auto;border-radius:24px;overflow:hidden;background:linear-gradient(145deg,#073b2b,#0d6b4a);color:#fff;box-shadow:0 22px 55px #0005}.membership-head{display:flex;justify-content:space-between;padding:25px;background:linear-gradient(90deg,#0b7a53,#059669)}.membership-head h2{margin:4px 0}.badge{background:var(--accent);color:#16281e;padding:8px 13px;border-radius:999px;height:max-content;font-weight:900}.membership-body{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#ffffff20}.membership-body div{background:#073b2b;padding:16px}.membership-body small{display:block;color:#cce9dd;margin-bottom:4px}.membership footer{padding:13px 25px;color:#cce9dd;font-size:.75rem}.empty{text-align:center;padding:50px;color:var(--muted)}.org{grid-template-columns:repeat(4,1fr)}.person{text-align:center;padding:18px}.person img,.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;margin:auto;border:4px solid var(--primary)}.avatar{display:grid;place-items:center;background:var(--primary);font-weight:900;font-size:1.5rem}.person h4{color:var(--accent);margin:10px 0 3px}.modal{position:fixed;inset:0;background:#000c;z-index:50;padding:18px;overflow:auto}.modal-box{max-width:1100px;margin:10px auto;background:var(--panel);border:1px solid var(--border);border-radius:20px}.modal-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--panel);border-bottom:1px solid var(--border);border-radius:20px 20px 0 0}.modal-body{padding:20px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.tabs button{padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:#ffffff0b;color:var(--text);font-weight:700}.tabs button.on{background:var(--primary)}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}.list{display:grid;gap:8px;margin-top:12px}.list-item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px;background:#ffffff09;border-radius:10px}.notice{padding:12px;border-radius:10px;background:#f59e0b20;border:1px solid #f59e0b66;color:#fde9bd}.statusline{position:fixed;right:14px;bottom:68px;padding:8px 12px;background:#111;color:#fff;border-radius:10px;z-index:80;display:none}.statusline.show{display:block}@media(max-width:1000px){.main-grid{grid-template-columns:1fr}.media{min-height:55vh}.side{grid-template-columns:1fr 1fr}.grid4,.org{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.top{flex-wrap:wrap}.identity{order:2;flex-basis:100%}.actions{position:absolute;right:14px;top:18px}.logo{width:120px}.side,.grid2,.grid4,.org,.admin-grid,.membership-body{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}.membership-head{display:block}.badge{display:inline-block;margin-top:8px}.wrap{padding-left:12px;padding-right:12px}}@media print{body *{visibility:hidden}.membership,.membership *{visibility:visible}.membership{position:absolute;left:0;top:0;width:100%;box-shadow:none}}

<header class="header"><div class="top"><img class="logo" src="LOGO AR RAUDHAH 2023-07.png" alt="Logo" onerror="this.style.visibility='hidden'"><div class="identity"><h1>SURAU AR-RAUDHAH ERISTANA</h1><p>No.1, Eristana, Persiaran Seri Pristana 1, Seri Pristana, 47000 Sungai Buloh, Selangor · JAI.SEL.BPM/01/037/197</p></div><div class="actions"><button class="icon" onclick="fontSize(-1)">A−</button><button class="icon" onclick="fontSize(1)">A+</button><button class="icon" onclick="toggleMode()">◐</button><button class="icon" onclick="showPage('org')">♙</button><button class="icon" onclick="openAdmin()">⚙</button></div></div><nav class="nav" id="nav"></nav></header>

<div id="adminModal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h2>⚙ Pentadbiran Portal</h2><button class="icon" onclick="closeAdmin()">✕</button></div><div class="modal-body" id="adminBody"></div></div></div><div class="statusline" id="toast"></div>
<script>
const SUPABASE_URL='https://zhqpduobgnooitbiysgc.supabase.co';
const SUPABASE_KEY='sb_publishable_IqVhiEoboYeaEvFy0Yfgeg__a4dewJm';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const KARIAH_FORM='https://docs.google.com/forms/d/e/1FAIpQLSdZr3MmYzqZPqv9GJUv6xvX6L9FkwurygA0QW6IhZGPcMtbuw/viewform?usp=dialog';
const ESOLAT='https://www.e-solat.gov.my/index.php?r=esolatApi/takwimsolat&zone=SGR02&period=today';
const pages=[['home','Utama'],['prayer','Waktu Solat'],['quran','e-Quran'],['kariah','Ahli Kariah'],['khairat','Khairat Kematian'],['finance','Maklumat Kewangan'],['documents','Dokumen']];
let state={page:'home',settings:{theme:'zamrud',primary:'#16a34a',accent:'#f4c95d',marquee_speed:24,slide_seconds:10},pageSettings:{},announcements:[],events:[],org:[],media:[],funds:[],documents:[],prayers:[],slide:0,user:null,profile:null};
const fallbackPrayers=[['Imsak','05:52'],['Subuh','06:02'],['Syuruk','07:10'],['Zohor','13:18'],['Asar','16:36'],['Maghrib','19:25'],['Isyak','20:35']].map(([name,time])=>({name,time}));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
function fmtTime(t){let [h,m]=t.split(':').map(Number),d=new Date(2000,0,1,h,m);return d.toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit',hour12:true})}
function nowMY(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Kuala_Lumpur'}))}
async function safeLoad(table,order){let q=sb.from(table).select('*');if(order)q=q.order(order);let {data,error}=await q;if(error){console.warn(table,error.message);return []}return data||[]}
async function loadAll(){
 const [ann,ev,org,med,funds,docs,pg,settings]=await Promise.all([safeLoad('announcements','display_order'),safeLoad('islamic_events','event_date'),safeLoad('organization_members','position_order'),safeLoad('media_items','display_order'),safeLoad('funds','display_order'),safeLoad('documents','created_at'),safeLoad('page_settings','display_order'),safeLoad('site_settings')]);
 state.announcements=ann;state.events=ev;state.org=org;state.media=med;state.funds=funds;state.documents=docs;state.pageSettings=Object.fromEntries(pg.map(x=>[x.page_code,x.enabled]));
 settings.forEach(x=>{if(x.setting_key==='theme')Object.assign(state.settings,x.setting_value);if(x.setting_key==='display')Object.assign(state.settings,x.setting_value)});applySettings();renderNav();render();
}
async function loadPrayer(){try{let r=await fetch(ESOLAT,{cache:'no-store'}),j=await r.json(),d=j.prayerTime?.[0];if(!d)throw 0;state.prayers=[['Imsak',d.imsak],['Subuh',d.fajr],['Syuruk',d.syuruk],['Zohor',d.dhuhr],['Asar',d.asr],['Maghrib',d.maghrib],['Isyak',d.isha]].map(([name,time])=>({name,time:time.slice(0,5)}))}catch(e){state.prayers=fallbackPrayers}render()}
function applySettings(){let s=state.settings;document.documentElement.style.setProperty('--primary',s.primary||'#16a34a');document.documentElement.style.setProperty('--accent',s.accent||'#f4c95d');document.documentElement.style.setProperty('--marquee',(s.marquee_speed||s.marqueeSpeedSeconds||24)+'s');document.getElementById('marqueeText').textContent=state.announcements.find(x=>x.active!==false)?.announcement_text||'Selamat datang ke Surau Ar-Raudhah Eristana.'}
function renderNav(){document.getElementById('nav').innerHTML=pages.filter(([id])=>state.pageSettings[id]!==false).map(([id,label])=>`<button class="${state.page===id?'active':''}" onclick="showPage('${id}')">${label}</button>`).join('')}
function showPage(p){state.page=p;renderNav();render();scrollTo(0,0)}
function render(){let c=document.getElementById('content');c.innerHTML=state.page==='home'?home():state.page==='prayer'?prayerPage():state.page==='quran'?placeholder('e-Quran','Integrasi Quran Foundation akan disambungkan melalui backend yang selamat.'):state.page==='kariah'?kariahPage():state.page==='khairat'?khairatPage():state.page==='finance'?financePage():state.page==='documents'?documentsPage():orgPage()}
function currentPrayer(){let n=nowMY(),mins=n.getHours()*60+n.getMinutes(),idx=state.prayers.findIndex((p,i)=>i>0&&+p.time.slice(0,2)*60 + +p.time.slice(3,5)>mins);if(idx<0)idx=1;return {next:idx,current:Math.max(1,idx-1)}}
function home(){let n=nowMY(),cp=currentPrayer(),p=state.prayers.length?state.prayers:fallbackPrayers,next=p[cp.next],target=new Date(n);let [h,m]=next.time.split(':').map(Number);target.setHours(h,m,0,0);if(target<=n)target.setDate(target.getDate()+1);let rem=Math.max(0,target-n),hh=String(Math.floor(rem/36e5)).padStart(2,'0'),mm=String(Math.floor(rem%36e5/6e4)).padStart(2,'0'),ss=String(Math.floor(rem%6e4/1000)).padStart(2,'0');let events=state.events.filter(x=>x.active!==false&&new Date(x.event_date+'T00:00:00')>n).slice(0,2);return `<div class="main-grid"><aside class="side"><section class="card clock"><div class="time" id="clock">${n.toLocaleTimeString('en-MY',{hour12:true})}</div><div class="muted">GMT+8 · ${n.toLocaleDateString('ms-MY',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><div class="gold">${new Intl.DateTimeFormat('ms-MY-u-ca-islamic',{day:'numeric',month:'long',year:'numeric'}).format(n)}</div></section><section class="card section"><h3>Waktu Solat Hari Ini</h3>${p.map((x,i)=>`<div class="prayer ${i===cp.current?'current':''} ${i===cp.next?'next':''}"><b>${x.name}</b><b>${fmtTime(x.time)}</b></div>`).join('')}<div class="count">${next.name} dalam ${hh}:${mm}:${ss}</div></section><section class="card section"><h3>Peristiwa Penting</h3>${events.length?events.map(e=>`<div class="event"><span>${esc(e.event_name)}</span><b class="gold">${Math.ceil((new Date(e.event_date)-n)/864e5)} hari</b></div>`).join(''):'<p class="muted">Belum dikemas kini.</p>'}</section></aside>${mediaView()}</div>`}
function mediaUrl(x){if(!x)return'';if(x.public_url)return x.public_url;if(x.storage_path){let b=x.bucket_name||'surau-media';return sb.storage.from(b).getPublicUrl(x.storage_path).data.publicUrl}return''}
function mediaView(){let x=state.media.filter(m=>m.active!==false)[state.slide%Math.max(1,state.media.filter(m=>m.active!==false).length)];if(!x)return `<section class="card media"><div class="empty"><div style="font-size:5rem">🕌</div><h2>Selamat Datang</h2><p>Media boleh dimuat naik melalui pentadbiran Supabase.</p></div></section>`;let u=mediaUrl(x);return `<section class="card media">${x.media_type==='video'?`<video src="${esc(u)}" autoplay muted controls onended="nextSlide()"></video>`:`<img src="${esc(u)}" alt="Media surau">`}<div class="caption">${esc(x.caption||x.title||'')}</div></section>`}
function nextSlide(){state.slide++;render()}
function prayerPage(){let p=state.prayers.length?state.prayers:fallbackPrayers;return `<div class="page-title"><h2>Waktu Solat</h2><p class="muted">Zon SGR02 · format 12 jam</p></div><div class="grid grid4">${p.map(x=>`<div class="card tile"><span class="muted">${x.name}</span><br><strong>${fmtTime(x.time)}</strong></div>`).join('')}</div>`}
function placeholder(t,d){return `<div class="page-title"><h2>${t}</h2></div><div class="card empty"><h3>${d}</h3></div>`}
function kariahPage(){return `<div class="page-title"><h2>Ahli Kariah</h2><p class="muted">Semak keahlian menggunakan nombor IC penuh.</p></div><div class="card search-box"><div class="notice">Maklumat hanya akan dipaparkan selepas padanan IC tepat. Jangan gunakan komputer awam tanpa menutup paparan selepas semakan.</div><div class="form-row" style="margin-top:14px"><input id="kariahIc" class="input" inputmode="numeric" placeholder="No. IC penuh, contoh 900101101234"><button class="btn" onclick="lookupKariah()">Semak Keahlian</button></div><div style="margin-top:12px"><a class="btn secondary" style="display:inline-block;text-decoration:none" target="_blank" href="${KARIAH_FORM}">Daftar / Mohon Kemas Kini</a></div></div><div id="kariahResult"></div>`}
async function lookupKariah(){let ic=document.getElementById('kariahIc').value.replace(/\D/g,'');if(ic.length<10)return toast('Masukkan nombor IC penuh.');let box=document.getElementById('kariahResult');box.innerHTML='<div class="empty">Sedang menyemak…</div>';try{let {data,error}=await sb.functions.invoke('member-lookup',{body:{module:'kariah',queryType:'ic',query:ic}});if(error)throw error;if(!data?.found){box.innerHTML=`<div class="card empty"><h3>Rekod tidak ditemui</h3><p>Sila pastikan IC tepat atau gunakan borang pendaftaran.</p><a class="btn" target="_blank" href="${KARIAH_FORM}">Buka Borang</a></div>`;return}box.innerHTML=memberCard(data.member)}catch(e){box.innerHTML=`<div class="card empty"><h3>Semakan tidak berjaya</h3><p>${esc(e.message||'Pastikan Edge Function member-lookup telah dideploy.')}</p></div>`}}
function memberCard(m){let rows=[['Serial ID',m.serialId],['Nama Penuh',m.fullName],['E-mel',m.email],['Alamat dalam IC',m.addressIc],['Alamat Semasa',m.currentAddress],['No. Telefon',m.phoneNumber],['Status Perkahwinan',m.maritalStatus],['Blok',m.block]];return `<article class="membership"><div class="membership-head"><div><small>KAD DIGITAL AHLI KARIAH</small><h2>SURAU AR-RAUDHAH ERISTANA</h2></div><span class="badge">${esc(m.membershipStatus||'Aktif')}</span></div><div class="membership-body">${rows.map(([k,v])=>`<div><small>${k}</small><strong>${esc(v||'-')}</strong></div>`).join('')}</div><footer>Untuk paparan ahli berkenaan sahaja. Sila tutup paparan selepas mengambil tangkap layar.</footer></article><div style="text-align:center"><button class="btn secondary" onclick="window.print()">Cetak / Simpan PDF</button> <button class="btn danger" onclick="document.getElementById('kariahResult').innerHTML=''">Tutup Kad</button></div>`}
function khairatPage(){return `<div class="page-title"><h2>Khairat Kematian</h2><p class="muted">Modul ini disediakan sebagai placeholder.</p></div><div class="card search-box"><div class="form-row"><input class="input" placeholder="No. IC penuh" disabled><button class="btn" disabled>Semak</button></div><div class="empty"><p>Pangkalan data dan borang Khairat akan disambungkan kemudian.</p></div></div>`}
function financePage(){return `<div class="page-title"><h2>Maklumat Kewangan</h2><p class="muted">Baki semasa dana surau</p></div><div class="grid grid4">${state.funds.length?state.funds.filter(x=>x.active!==false).map(x=>`<div class="card tile"><span class="muted">${esc(x.fund_name)}</span><br><strong>RM ${Number(x.current_balance||0).toLocaleString('en-MY',{minimumFractionDigits:2})}</strong><p class="muted">Setakat ${esc(x.as_at_date||'-')}</p></div>`).join(''):'<div class="card empty">Belum dikemas kini.</div>'}</div>`}
function documentsPage(){let docs=state.documents.filter(x=>x.active!==false&&(x.access_level==='public'||state.user));return `<div class="page-title"><h2>Dokumen</h2></div><div class="list">${docs.length?docs.map(x=>`<div class="card list-item"><span>📄 ${esc(x.document_name)}</span><a class="btn secondary" target="_blank" href="${esc(x.public_url||'#')}">Buka</a></div>`).join(''):'<div class="card empty">Tiada dokumen tersedia.</div>'}</div>`}
function orgPage(){return `<div class="page-title"><h2>Carta Organisasi</h2></div><div class="grid org">${state.org.length?state.org.filter(x=>x.active!==false).map(x=>`<div class="card person">${x.photo_url?`<img src="${esc(x.photo_url)}">`:`<div class="avatar">${esc((x.person_name||'?').slice(0,2).toUpperCase())}</div>`}<h4>${esc(x.position_name)}</h4><b>${esc(x.person_name||'Belum dilantik')}</b><p class="muted">${esc(x.house||'')}<br>${esc(x.phone||'')}<br>${esc(x.task_description||'')}</p></div>`).join(''):'<div class="card empty">Carta organisasi belum dikemas kini.</div>'}</div>`}
function fontSize(d){let v=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--scale'))||1;document.documentElement.style.setProperty('--scale',Math.max(.8,Math.min(1.25,v+d*.05)))}
function toggleMode(){let light=document.body.dataset.light==='1';document.body.dataset.light=light?'0':'1';if(!light){document.documentElement.style.setProperty('--bg','#eef7f1');document.documentElement.style.setProperty('--panel','#fff');document.documentElement.style.setProperty('--panel2','#f4faf6');document.documentElement.style.setProperty('--text','#12251c');document.documentElement.style.setProperty('--muted','#5d7167')}else location.reload()}
async function openAdmin(){document.getElementById('adminModal').classList.remove('hidden');let {data}=await sb.auth.getSession();if(data.session){state.user=data.session.user;await loadProfile();renderAdmin()}else loginView()}
function closeAdmin(){document.getElementById('adminModal').classList.add('hidden')}
function loginView(){document.getElementById('adminBody').innerHTML=`<div style="max-width:420px;margin:20px auto"><label class="field">E-mel<input id="adminEmail" class="input" type="email"></label><label class="field" style="margin-top:10px">Kata laluan<input id="adminPass" class="input" type="password"></label><button class="btn" style="width:100%;margin-top:14px" onclick="adminLogin()">Log Masuk</button></div>`}
async function adminLogin(){let email=document.getElementById('adminEmail').value,password=document.getElementById('adminPass').value;let {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return toast(error.message);state.user=data.user;await loadProfile();if(!['admin','editor'].includes(state.profile?.role)){await sb.auth.signOut();state.user=null;return toast('Akaun tiada akses pentadbir.')}renderAdmin()}
async function loadProfile(){let {data}=await sb.from('profiles').select('*').eq('id',state.user.id).maybeSingle();state.profile=data}
function renderAdmin(tab='general'){let body=document.getElementById('adminBody');body.innerHTML=`<div class="tabs">${[['general','Umum'],['announce','Pengumuman'],['event','Peristiwa'],['org','Organisasi'],['fund','Kewangan'],['pages','Halaman'],['media','Media'],['account','Akaun']].map(([id,l])=>`<button class="${tab===id?'on':''}" onclick="renderAdmin('${id}')">${l}</button>`).join('')}</div><div id="adminPane"></div>`;let pane=document.getElementById('adminPane');if(tab==='general')pane.innerHTML=adminGeneral();if(tab==='announce')pane.innerHTML=adminAnnouncements();if(tab==='event')pane.innerHTML=adminEvents();if(tab==='org')pane.innerHTML=adminOrg();if(tab==='fund')pane.innerHTML=adminFunds();if(tab==='pages')pane.innerHTML=adminPages();if(tab==='media')pane.innerHTML=adminMedia();if(tab==='account')pane.innerHTML=`<p>Log masuk sebagai <b>${esc(state.user.email)}</b></p><button class="btn danger" onclick="adminLogout()">Log Keluar</button>`}
function adminGeneral(){return `<div class="admin-grid"><label class="field">Warna utama<input id="aPrimary" class="input" type="color" value="${state.settings.primary||'#16a34a'}"></label><label class="field">Warna aksen<input id="aAccent" class="input" type="color" value="${state.settings.accent||'#f4c95d'}"></label><label class="field">Kelajuan marquee (saat)<input id="aSpeed" class="input" type="number" min="8" max="60" value="${state.settings.marquee_speed||24}"></label><label class="field">Tempoh slaid (saat)<input id="aSlide" class="input" type="number" min="3" max="120" value="${state.settings.slide_seconds||10}"></label><button class="btn full" onclick="saveGeneral()">Simpan Tetapan</button></div>`}
async function saveGeneral(){let theme={primary:aPrimary.value,accent:aAccent.value},display={marquee_speed:+aSpeed.value,slide_seconds:+aSlide.value};let a=await sb.from('site_settings').upsert({setting_key:'theme',setting_value:theme,updated_by:state.user.id},{onConflict:'setting_key'}),b=await sb.from('site_settings').upsert({setting_key:'display',setting_value:display,updated_by:state.user.id},{onConflict:'setting_key'});if(a.error||b.error)return toast((a.error||b.error).message);Object.assign(state.settings,theme,display);applySettings();toast('Tetapan disimpan untuk semua peranti.')}
function adminAnnouncements(){return `<button class="btn" onclick="editAnnouncement()">Tambah Pengumuman</button><div class="list">${state.announcements.map(x=>`<div class="list-item"><span>${esc(x.announcement_text)}</span><button class="btn secondary" onclick='editAnnouncement(${JSON.stringify(x)})'>Edit</button></div>`).join('')}</div>`}
async function editAnnouncement(x){let text=prompt('Teks pengumuman',x?.announcement_text||'');if(text===null)return;let row={announcement_text:text,active:true,display_order:x?.display_order||0,updated_by:state.user.id};let r=x?.id?await sb.from('announcements').update(row).eq('id',x.id):await sb.from('announcements').insert(row);if(r.error)return toast(r.error.message);state.announcements=await safeLoad('announcements','display_order');applySettings();renderAdmin('announce');toast('Pengumuman dikemas kini.')}
function adminEvents(){return `<button class="btn" onclick="editEvent()">Tambah Peristiwa</button><div class="list">${state.events.map(x=>`<div class="list-item"><span>${esc(x.event_name)} · ${esc(x.event_date)}</span><button class="btn secondary" onclick='editEvent(${JSON.stringify(x)})'>Edit</button></div>`).join('')}</div>`}
async function editEvent(x){let name=prompt('Nama peristiwa',x?.event_name||'');if(!name)return;let date=prompt('Tarikh YYYY-MM-DD',x?.event_date||'');if(!date)return;let row={event_name:name,event_date:date,active:true,updated_by:state.user.id};let r=x?.id?await sb.from('islamic_events').update(row).eq('id',x.id):await sb.from('islamic_events').insert(row);if(r.error)return toast(r.error.message);state.events=await safeLoad('islamic_events','event_date');renderAdmin('event');toast('Peristiwa disimpan.')}
function adminOrg(){let opts=['Pengerusi','Timbalan Pengerusi',...Array.from({length:5},(_,i)=>'Imam '+(i+1)),...Array.from({length:5},(_,i)=>'Bilal '+(i+1)),...Array.from({length:5},(_,i)=>'Siak '+(i+1)),'Setiausaha','Penolong Setiausaha','Bendahari','Penolong Bendahari',...Array.from({length:6},(_,i)=>'Jawatankuasa '+(i+1)),'Wakil Pemuda','Wakil Muslimat','Pemeriksa Kira-kira 1','Pemeriksa Kira-kira 2'];return `<label class="field">Jawatan<select id="orgSelect" class="input" onchange="populateOrg()"><option value="">Pilih jawatan</option>${opts.map(x=>`<option>${x}</option>`).join('')}</select></label><div class="admin-grid" style="margin-top:12px"><input id="oName" class="input" placeholder="Nama"><input id="oHouse" class="input" placeholder="Rumah"><input id="oPhone" class="input" placeholder="No. Telefon"><input id="oPhoto" class="input" placeholder="URL Foto"><input id="oTask" class="input full" placeholder="Tugasan"><button class="btn full" onclick="saveOrg()">Simpan / Kemas Kini</button></div>`}
function populateOrg(){let x=state.org.find(r=>r.position_name===orgSelect.value)||{};oName.value=x.person_name||'';oHouse.value=x.house||'';oPhone.value=x.phone||'';oPhoto.value=x.photo_url||'';oTask.value=x.task_description||''}
async function saveOrg(){let pos=orgSelect.value;if(!pos)return toast('Pilih jawatan.');let old=state.org.find(r=>r.position_name===pos),row={position_code:pos.toLowerCase().replace(/[^a-z0-9]+/g,'-'),position_name:pos,person_name:oName.value,house:oHouse.value,phone:oPhone.value,photo_url:oPhoto.value,task_description:oTask.value,active:true,updated_by:state.user.id};let r=old?await sb.from('organization_members').update(row).eq('id',old.id):await sb.from('organization_members').insert(row);if(r.error)return toast(r.error.message);state.org=await safeLoad('organization_members','position_order');toast('Organisasi disimpan.')}
function adminFunds(){return `<div class="list">${state.funds.map(x=>`<div class="list-item"><b>${esc(x.fund_name)}</b><span>RM ${Number(x.current_balance||0).toFixed(2)}</span><button class="btn secondary" onclick='editFund(${JSON.stringify(x)})'>Edit</button></div>`).join('')}</div>`}
async function editFund(x){let v=prompt('Baki semasa',x.current_balance);if(v===null)return;let r=await sb.from('funds').update({current_balance:+v,as_at_date:new Date().toISOString().slice(0,10),updated_by:state.user.id}).eq('id',x.id);if(r.error)return toast(r.error.message);state.funds=await safeLoad('funds','display_order');renderAdmin('fund');toast('Baki dikemas kini.')}
function adminPages(){return `<div class="grid grid2">${pages.filter(x=>x[0]!=='home').map(([id,l])=>`<label class="card list-item"><b>${l}</b><input type="checkbox" ${state.pageSettings[id]!==false?'checked':''} onchange="togglePage('${id}',this.checked)"></label>`).join('')}</div>`}
async function togglePage(id,on){let label=pages.find(x=>x[0]===id)[1];let r=await sb.from('page_settings').upsert({page_code:id,page_name:label,enabled:on,updated_by:state.user.id},{onConflict:'page_code'});if(r.error)return toast(r.error.message);state.pageSettings[id]=on;renderNav();toast('Tetapan halaman dikemas kini.')}
function adminMedia(){return `<div class="notice">Muat naik ke bucket public <b>surau-media</b>. Polisi Storage mesti membenarkan admin authenticated.</div><div class="admin-grid" style="margin-top:12px"><input id="mediaFile" class="input full" type="file" accept="image/*,video/*"><input id="mediaCaption" class="input full" placeholder="Kapsyen"><button class="btn full" onclick="uploadMedia()">Muat Naik</button></div><div class="list">${state.media.map(x=>`<div class="list-item"><span>${esc(x.caption||x.title||x.storage_path)}</span></div>`).join('')}</div>`}
async function uploadMedia(){let f=mediaFile.files[0];if(!f)return toast('Pilih fail.');let path=Date.now()+'-'+f.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-');let u=await sb.storage.from('surau-media').upload(path,f);if(u.error)return toast(u.error.message);let r=await sb.from('media_items').insert({media_type:f.type.startsWith('video')?'video':'image',title:f.name,caption:mediaCaption.value,storage_path:path,active:true,updated_by:state.user.id});if(r.error)return toast(r.error.message);state.media=await safeLoad('media_items','display_order');renderAdmin('media');toast('Media dimuat naik.')}
async function adminLogout(){await sb.auth.signOut();state.user=null;state.profile=null;loginView()}
function subscribe(){['announcements','islamic_events','organization_members','media_items','funds','page_settings','site_settings'].forEach(t=>sb.channel('rt-'+t).on('postgres_changes',{event:'*',schema:'public',table:t},()=>loadAll()).subscribe())}
setInterval(()=>{if(state.page==='home')render()},1000);setInterval(()=>{if(state.media.length){state.slide++;if(state.page==='home')render()}},10000);
(async()=>{let {data}=await sb.auth.getSession();state.user=data.session?.user||null;state.prayers=fallbackPrayers;await Promise.all([loadAll(),loadPrayer()]);subscribe()})();
</script>
</body></html>
