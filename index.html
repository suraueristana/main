function mediaIsActive(m){if(m.active===false)return false;let now=nowMY(),today=now.toISOString().slice(0,10),tm=now.toTimeString().slice(0,5);if(m.start_date&&today<m.start_date)return false;if(m.end_date&&today>m.end_date)return false;if(m.daily_start_time&&m.daily_end_time){let a=String(m.daily_start_time).slice(0,5),b=String(m.daily_end_time).slice(0,5);if(a<=b){if(tm<a||tm>b)return false}else if(tm>b&&tm<a)return false}return true}
function mediaView(){let activeMedia=state.media.filter(mediaIsActive),x=activeMedia[state.slide%Math.max(1,activeMedia.length)];if(!x)return `<section class="card media"><div class="empty"><div style="font-size:5rem">🕌</div><h2>Selamat Datang</h2><p>Media boleh dimuat naik melalui pentadbiran Supabase.</p></div></section>`;let u=mediaUrl(x);return `<section class="card media">${x.media_type==='video'?`<video src="${esc(u)}" autoplay muted controls onended="nextSlide()"></video>`:`<img src="${esc(u)}" alt="Media surau">`}<div class="caption">${esc(x.caption||x.title||'')}</div></section>`}
function nextSlide(){state.slide++;render()}
function prayerPage(){let pv=state.prayerView,rows=pv.rows.length?pv.rows:[{date:new Date().toISOString().slice(0,10),day:'',...Object.fromEntries((state.prayers.length?state.prayers:fallbackPrayers).map(x=>[x.name,x.time]))}],states=[...new Set(state.zones.map(x=>x.state))].sort((a,b)=>a.localeCompare(b,'ms'));let chosen=state.zones.find(x=>x.zone===pv.zone),selectedState=chosen?.state||'';return `<div class="print-area"><div class="print-header"><img src="LOGO AR RAUDHAH 2023-07.png" alt="Logo Surau"><div><h1>Jadual Waktu e-Solat JAKIM</h1><p><b>SURAU AR-RAUDHAH ERISTANA</b></p><p class="muted">${esc(zoneLabel(pv.zone))} · ${periodLabel(pv.period)}</p></div></div><div class="page-title no-print"><h2>Waktu Solat</h2><p class="muted">Jadual e-Solat JAKIM · ${esc(zoneLabel(pv.zone))}</p></div><div class="card section no-print"><div class="admin-grid"><label class="field">Negeri<select id="prayerState" class="input" onchange="renderZoneOptions(this.value)">${states.map(x=>`<option value="${esc(x)}" ${x===selectedState?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label class="field">Zon<select id="prayerZone" class="input">${zoneOptions(selectedState,pv.zone)}</select></label><label class="field">Tempoh<select id="prayerPeriod" class="input"><option value="today" ${pv.period==='today'?'selected':''}>Hari Ini</option><option value="week" ${pv.period==='week'?'selected':''}>Minggu</option><option value="month" ${pv.period==='month'?'selected':''}>Bulan</option><option value="year" ${pv.period==='year'?'selected':''}>Tahun</option></select></label><div class="field" style="justify-content:end"><button class="btn" onclick="loadPrayerSchedule()">Papar Jadual</button></div><div class="full"><button class="btn secondary" onclick="window.print()">Cetak / Simpan PDF</button></div></div></div><div style="overflow:auto;margin-top:14px"><table style="width:100%;border-collapse:collapse;min-width:950px"><thead><tr>${['Tarikh','Hari','Imsak','Subuh','Syuruk','Zohor','Asar','Maghrib','Isyak'].map(x=>`<th style="padding:11px;border-bottom:2px solid var(--primary);text-align:left">${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${[r.date,r.day,r.Imsak,r.Subuh,r.Syuruk,r.Zohor,r.Asar,r.Maghrib,r.Isyak].map((v,i)=>`<td style="padding:10px;border-bottom:1px solid var(--border)">${i>1&&v?fmtTime(String(v).slice(0,5)):esc(v||'-')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function periodLabel(p){return ({today:'Hari Ini',week:'Minggu',month:'Bulan',year:'Tahun'})[p]||p}
async function loadZones(){state.zones=EMBEDDED_ZONES;try{let r=await fetch('assets/groups.json',{cache:'no-store'});if(r.ok){let remote=await r.json();if(Array.isArray(remote)&&remote.length>state.zones.length/2)state.zones=remote}}catch(e){console.warn('Menggunakan senarai zon terbina dalam.')}if(state.page==='prayer')render()}

async function loadPrayerSchedule(){let zone=document.getElementById('prayerZone').value,period=document.getElementById('prayerPeriod').value;try{let r=await fetch(`https://www.e-solat.gov.my/index.php?r=esolatApi/takwimsolat&zone=${encodeURIComponent(zone)}&period=${period}`,{cache:'no-store'});if(!r.ok)throw Error('API e-Solat tidak dapat dicapai');let j=await r.json(),list=j.prayerTime||[];state.prayerView={zone,period,rows:list.map(d=>({date:d.date||'',day:d.day||'',Imsak:d.imsak?.slice(0,5),Subuh:d.fajr?.slice(0,5),Syuruk:d.syuruk?.slice(0,5),Zohor:d.dhuhr?.slice(0,5),Asar:d.asr?.slice(0,5),Maghrib:d.maghrib?.slice(0,5),Isyak:d.isha?.slice(0,5)}))};if(!list.length)throw Error('Tiada jadual diterima');render()}catch(e){toast(e.message)}}

function kariahPage(){return `<div class="page-title"><h2>Ahli Kariah</h2><p class="muted">Semak keahlian menggunakan nombor IC penuh.</p></div><div class="card search-box"><div class="notice">Maklumat hanya akan dipaparkan selepas padanan IC tepat. Jangan gunakan komputer awam tanpa menutup paparan selepas semakan.</div><div class="form-row" style="margin-top:14px"><input id="kariahIc" class="input" inputmode="numeric" placeholder="No. IC penuh, contoh 900101101234"><button class="btn" onclick="lookupKariah()">Semak Keahlian</button></div><div style="margin-top:12px"><a class="btn secondary" style="display:inline-block;text-decoration:none" target="_blank" href="${KARIAH_FORM}">Daftar / Mohon Kemas Kini</a></div></div><div id="kariahResult"></div>`}

function adminOrg(){let opts=['Pengerusi','Timbalan Pengerusi',...Array.from({length:5},(_,i)=>'Imam '+(i+1)),...Array.from({length:5},(_,i)=>'Bilal '+(i+1)),...Array.from({length:5},(_,i)=>'Siak '+(i+1)),'Setiausaha','Penolong Setiausaha','Bendahari','Penolong Bendahari',...Array.from({length:6},(_,i)=>'Jawatankuasa '+(i+1)),'Wakil Pemuda','Wakil Muslimat','Pemeriksa Kira-kira 1','Pemeriksa Kira-kira 2'];return `<label class="field">Jawatan<select id="orgSelect" class="input" onchange="populateOrg()"><option value="">Pilih jawatan</option>${opts.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label><div class="admin-grid" style="margin-top:12px"><input id="oName" class="input" placeholder="Nama"><input id="oHouse" class="input" placeholder="Rumah"><input id="oPhone" class="input" placeholder="No. Telefon"><input id="oTask" class="input full" placeholder="Tugasan"><label class="field full">Foto<input class="input" type="file" accept="image/*" onchange="openCrop(this.files[0])"></label><div id="cropBox" class="full hidden"><div class="notice">Seret foto dan laraskan zoom. Foto disimpan dalam nisbah 1:1.</div><canvas id="cropCanvas" class="crop-canvas" width="500" height="500"></canvas><label class="field">Zoom<input id="cropZoom" type="range" min="1" max="3" step=".01" value="1" oninput="crop.z=+this.value;drawCrop()"></label></div><div id="currentPhoto" class="full"></div><button class="btn full" onclick="saveOrg()">Simpan / Kemas Kini</button></div>`}
function populateOrg(){let x=state.org.find(r=>r.position_name===orgSelect.value)||{};oName.value=x.person_name||'';oHouse.value=x.house||'';oPhone.value=x.phone||'';oTask.value=x.task_description||'';crop={img:null,z:1,x:0,y:0};cropBox.classList.add('hidden');currentPhoto.innerHTML=orgPhoto(x)?`<p class="muted">Foto semasa</p><img src="${esc(orgPhoto(x))}" style="width:110px;height:110px;border-radius:50%;object-fit:cover">`:''}
function openCrop(file){if(!file)return;let img=new Image();img.onload=()=>{crop={img,z:1,x:0,y:0};cropBox.classList.remove('hidden');cropZoom.value=1;cropDrag();drawCrop()};img.src=URL.createObjectURL(file)}
function drawCrop(){if(!crop.img)return;let c=cropCanvas,g=c.getContext('2d'),sc=Math.max(500/crop.img.width,500/crop.img.height)*crop.z,w=crop.img.width*sc,h=crop.img.height*sc;g.clearRect(0,0,500,500);g.drawImage(crop.img,(500-w)/2+crop.x,(500-h)/2+crop.y,w,h)}
function cropDrag(){let drag=false,x=0,y=0;cropCanvas.onpointerdown=e=>{drag=true;x=e.clientX;y=e.clientY;cropCanvas.setPointerCapture(e.pointerId)};cropCanvas.onpointermove=e=>{if(!drag)return;let r=500/cropCanvas.getBoundingClientRect().width;crop.x+=(e.clientX-x)*r;crop.y+=(e.clientY-y)*r;x=e.clientX;y=e.clientY;drawCrop()};cropCanvas.onpointerup=()=>drag=false}
async function saveOrg(){let pos=orgSelect.value;if(!pos)return toast('Pilih jawatan.');let old=state.org.find(r=>r.position_name===pos),photoPath=old?.photo_path||null;if(crop.img){let blob=await new Promise(r=>cropCanvas.toBlob(r,'image/jpeg',.9)),path=pos.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now()+'.jpg',u=await sb.storage.from('organization-photos').upload(path,blob,{contentType:'image/jpeg'});if(u.error)return toast(u.error.message);photoPath=path;if(old?.photo_path)await sb.storage.from('organization-photos').remove([old.photo_path])}let row={position_code:pos.toLowerCase().replace(/[^a-z0-9]+/g,'-'),position_name:pos,person_name:oName.value,house:oHouse.value,phone:oPhone.value,photo_path:photoPath,task_description:oTask.value,active:true,updated_by:state.user.id};let r=old?await sb.from('organization_members').update(row).eq('id',old.id):await sb.from('organization_members').insert(row);if(r.error)return toast(r.error.message);state.org=await safeLoad('organization_members','position_order');populateOrg();toast('Organisasi disimpan.')}
function adminFunds(){return `<button class="btn" onclick="editFund()">Tambah Dana</button><div class="list">${state.funds.map(x=>`<div class="list-item"><span><b>${esc(x.fund_name)}</b> · RM ${Number(x.current_balance||0).toFixed(2)}</span><span><button class="btn secondary" onclick='editFund(${JSON.stringify(x)})'>Edit</button> <button class="btn danger" onclick="deleteFund('${x.id}')">Padam</button></span></div>`).join('')}</div>`}
async function editFund(x){let name=prompt('Nama dana',x?.fund_name||'');if(!name)return;let value=prompt('Baki semasa',x?.current_balance??0);if(value===null||isNaN(+value))return;let row={fund_name:name,current_balance:+value,as_at_date:new Date().toISOString().slice(0,10),active:true,display_order:x?.display_order??state.funds.length+1,updated_by:state.user.id},r=x?.id?await sb.from('funds').update(row).eq('id',x.id):await sb.from('funds').insert(row);if(r.error)return toast(r.error.message);state.funds=await safeLoad('funds','display_order');renderAdmin('fund');toast('Dana disimpan.')}
async function deleteFund(id){if(!confirm('Padam dana ini?'))return;let r=await sb.from('funds').delete().eq('id',id);if(r.error)return toast(r.error.message);state.funds=await safeLoad('funds','display_order');renderAdmin('fund');toast('Dana dipadam.')}
function adminPages(){return `<div class="grid grid2">${pages.filter(x=>x[0]!=='home').map(([id,l])=>`<label class="card list-item"><b>${l}</b><input type="checkbox" ${state.pageSettings[id]!==false?'checked':''} onchange="togglePage('${id}',this.checked)"></label>`).join('')}</div>`}
async function togglePage(id,on){let label=pages.find(x=>x[0]===id)[1];let r=await sb.from('page_settings').upsert({page_code:id,page_name:label,enabled:on,updated_by:state.user.id},{onConflict:'page_code'});if(r.error)return toast(r.error.message);state.pageSettings[id]=on;renderNav();toast('Tetapan halaman dikemas kini.')}
function adminMedia(){return `<div class="notice">Jadual aktif menyokong sentiasa aktif, julat tarikh dan waktu harian.</div><button class="btn" style="margin-top:12px" onclick="editMedia()">Tambah Media</button><div class="list">${state.media.map(x=>`<div class="list-item"><span style="display:flex;align-items:center;gap:10px"><img class="media-thumb" src="${x.media_type==='image'?esc(mediaUrl(x)):''}"><span><b>${esc(x.caption||x.title||x.storage_path)}</b><br><small class="muted">${mediaScheduleText(x)}</small></span></span><span><button class="btn secondary" onclick='editMedia(${JSON.stringify(x)})'>Edit</button> <button class="btn danger" onclick="deleteMedia('${x.id}')">Padam</button></span></div>`).join('')}</div><div id="mediaEditor"></div>`}
function mediaScheduleText(x){return `${x.start_date||x.end_date?`${x.start_date||'…'} hingga ${x.end_date||'…'}`:'Sentiasa aktif'}${x.daily_start_time||x.daily_end_time?` · ${String(x.daily_start_time||'00:00').slice(0,5)}-${String(x.daily_end_time||'23:59').slice(0,5)}`:''}`}
function editMedia(x){mediaEditor.innerHTML=`<div class="card section" style="margin-top:12px"><h3>${x?'Edit':'Tambah'} Media</h3><div class="media-form">${x?'':`<label class="field full">Fail<input id="mFile" class="input" type="file" accept="image/*,video/*"></label>`}<label class="field full">Kapsyen<input id="mCaption" class="input" value="${esc(x?.caption||'')}"></label><label class="field">Tarikh mula<input id="mStart" class="input" type="date" value="${x?.start_date||''}"></label><label class="field">Tarikh tamat<input id="mEnd" class="input" type="date" value="${x?.end_date||''}"></label><label class="field">Waktu mula harian<input id="mTimeStart" class="input" type="time" value="${String(x?.daily_start_time||'').slice(0,5)}"></label><label class="field">Waktu tamat harian<input id="mTimeEnd" class="input" type="time" value="${String(x?.daily_end_time||'').slice(0,5)}"></label><label class="field">Aktif<input id="mActive" type="checkbox" ${x?.active===false?'':'checked'}></label><div class="full"><button class="btn" onclick='saveMedia(${x?JSON.stringify(x):'null'})'>Simpan</button> <button class="btn secondary" onclick="mediaEditor.innerHTML=''">Batal</button></div></div></div>`;mediaEditor.scrollIntoView({behavior:'smooth'})}
async function saveMedia(x){let row={caption:mCaption.value,start_date:mStart.value||null,end_date:mEnd.value||null,daily_start_time:mTimeStart.value||null,daily_end_time:mTimeEnd.value||null,active:mActive.checked,updated_by:state.user.id};if(x){let r=await sb.from('media_items').update(row).eq('id',x.id);if(r.error)return toast(r.error.message)}else{let f=mFile.files[0];if(!f)return toast('Pilih fail.');let path=Date.now()+'-'+f.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-'),u=await sb.storage.from('surau-media').upload(path,f);if(u.error)return toast(u.error.message);Object.assign(row,{media_type:f.type.startsWith('video')?'video':'image',title:f.name,storage_path:path,display_order:state.media.length+1});let r=await sb.from('media_items').insert(row);if(r.error)return toast(r.error.message)}state.media=await safeLoad('media_items','display_order');renderAdmin('media');toast('Media disimpan.')}
async function deleteMedia(id){if(!confirm('Padam media ini?'))return;let x=state.media.find(v=>v.id===id);if(x?.storage_path)await sb.storage.from(x.bucket_name||'surau-media').remove([x.storage_path]);let r=await sb.from('media_items').delete().eq('id',id);if(r.error)return toast(r.error.message);state.media=await safeLoad('media_items','display_order');renderAdmin('media');toast('Media dipadam.')}
async function adminLogout(){await sb.auth.signOut();state.user=null;state.profile=null;loginView()}
function subscribe(){['announcements','islamic_events','organization_members','media_items','funds','page_settings','site_settings'].forEach(t=>sb.channel('rt-'+t).on('postgres_changes',{event:'*',schema:'public',table:t},()=>loadAll()).subscribe())}
setInterval(()=>{if(state.page==='home')render()},1000);setInterval(()=>{if(state.media.length){state.slide++;if(state.page==='home')render()}},10000);
(async()=>{let {data}=await sb.auth.getSession();state.user=data.session?.user||null;state.prayers=fallbackPrayers;await Promise.all([loadAll(),loadPrayer()]);subscribe()})();
</script>
</body></html>
