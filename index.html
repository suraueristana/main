async function saveMedia(x){let row={caption:mCaption.value,start_date:mStart.value||null,end_date:mEnd.value||null,daily_start_time:mTimeStart.value||null,daily_end_time:mTimeEnd.value||null,active:mActive.checked,updated_by:state.user.id};if(x){let r=await sb.from('media_items').update(row).eq('id',x.id);if(r.error)return toast(r.error.message)}else{let f=mFile.files[0];if(!f)return toast('Pilih fail.');let path=Date.now()+'-'+f.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-'),u=await sb.storage.from('surau-media').upload(path,f);if(u.error)return toast(u.error.message);Object.assign(row,{media_type:f.type.startsWith('video')?'video':'image',title:f.name,storage_path:path,display_order:state.media.length+1});let r=await sb.from('media_items').insert(row);if(r.error)return toast(r.error.message)}state.media=await safeLoad('media_items','display_order');renderAdmin('media');toast('Media disimpan.')}

function adminMembers(){return `<div class="notice">Import CSV akan menggantikan keseluruhan senarai. Semak pratonton dan bilangan rekod sebelum meneruskan.</div><div class="grid grid2" style="margin-top:12px"><div class="card section"><h3>Import Ahli Kariah</h3><input id="csvKariah" class="input" type="file" accept=".csv,text/csv"><button class="btn" style="margin-top:8px" onclick="importMembers('kariah')">Semak & Ganti Senarai</button></div><div class="card section"><h3>Import Ahli Khairat</h3><input id="csvKhairat" class="input" type="file" accept=".csv,text/csv"><button class="btn" style="margin-top:8px" onclick="importMembers('khairat')">Semak & Ganti Senarai</button></div></div><div class="card section" style="margin-top:12px"><h3>Carian Pentadbir</h3><div class="admin-grid"><select id="memberType" class="input"><option value="kariah">Ahli Kariah</option><option value="khairat">Ahli Khairat</option></select><input id="memberName" class="input" placeholder="Nama atau sebahagian nama"><button class="btn full" onclick="adminMemberSearch()">Cari</button></div><div id="memberResults"></div></div>`}
async function importMembers(type){let input=type==='kariah'?csvKariah:csvKhairat,file=input.files[0];if(!file)return toast('Pilih fail CSV.');if(file.size>15*1024*1024)return toast('Fail melebihi 15MB.');let csv=await file.text(),lines=csv.split(/\r?\n/).filter(x=>x.trim()),headers=parseCsvLine(lines[0]||'');if(lines.length<2)return toast('CSV tidak mempunyai rekod.');let msg=`Jenis: ${type}\nFail: ${file.name}\nAnggaran rekod: ${lines.length-1}\nKolum: ${headers.join(', ')}\n\nTaip REPLACE untuk menggantikan keseluruhan senarai.`;if(prompt(msg)!=='REPLACE')return;toast('Import sedang diproses…');let {data,error}=await sb.functions.invoke('replace-members-csv',{body:{memberType:type,fileName:file.name,csv}});if(error)return toast(error.message);toast(`Import selesai: ${data?.rows||0} rekod.`)}
function parseCsvLine(line){let a=[],v='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'&&line[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){a.push(v.trim());v=''}else v+=c}a.push(v.trim());return a}
async function adminMemberSearch(){let type=memberType.value,name=memberName.value.trim();if(name.length<2)return toast('Masukkan sekurang-kurangnya 2 aksara.');let table=type==='kariah'?'kariah_members':'khairat_members',{data,error}=await sb.from(table).select('*').ilike('full_name',`%${name}%`).order('full_name').limit(50);if(error)return toast(error.message);memberResults.innerHTML=`<div class="member-results"><table class="data-table"><thead><tr>${data?.[0]?Object.keys(data[0]).map(k=>`<th>${esc(k)}</th>`).join(''):'<th>Keputusan</th>'}</tr></thead><tbody>${(data||[]).map(r=>`<tr>${Object.values(r).map(v=>`<td>${esc(v??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="muted">${data?.length||0} padanan.</p>`}
function adminDocuments(){return `<button class="btn" onclick="editDocument()">Tambah Dokumen</button><div class="list">${state.documents.map(x=>`<div class="list-item"><span><b>${esc(x.document_name)}</b><br><small>${esc(x.access_level||'public')}</small></span><span><button class="btn secondary" onclick='editDocument(${JSON.stringify(x)})'>Edit</button> <button class="btn danger" onclick="deleteDocument('${x.id}')">Padam</button></span></div>`).join('')}</div><div id="documentEditor"></div>`}
function editDocument(x){documentEditor.innerHTML=`<div class="card section" style="margin-top:12px"><div class="admin-grid"><label class="field">Nama Dokumen<input id="dName" class="input" value="${esc(x?.document_name||'')}"></label><label class="field">Kategori<input id="dCategory" class="input" value="${esc(x?.document_category||'')}"></label><label class="field">Akses<select id="dAccess" class="input"><option value="public" ${x?.access_level!=='admin'?'selected':''}>Awam</option><option value="admin" ${x?.access_level==='admin'?'selected':''}>Admin sahaja</option></select></label><label class="field">Aktif<input id="dActive" type="checkbox" ${x?.active===false?'':'checked'}></label><label class="field full">Fail ${x?'(pilih jika mahu ganti)':''}<input id="dFile" class="input" type="file"></label><div class="full"><button class="btn" onclick='saveDocument(${x?JSON.stringify(x):'null'})'>Simpan</button></div></div></div>`}
async function saveDocument(x){if(!dName.value.trim())return toast('Nama dokumen diperlukan.');let bucket=dAccess.value==='admin'?'admin-documents':'public-documents',path=x?.storage_path||null,file=dFile.files[0];if(file){path=Date.now()+'-'+file.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-');let u=await sb.storage.from(bucket).upload(path,file);if(u.error)return toast(u.error.message)}let row={document_name:dName.value.trim(),document_category:dCategory.value.trim(),access_level:dAccess.value,bucket_name:bucket,storage_path:path,active:dActive.checked,updated_by:state.user.id},r=x?.id?await sb.from('documents').update(row).eq('id',x.id):await sb.from('documents').insert(row);if(r.error)return toast(r.error.message);state.documents=await safeLoad('documents','created_at');renderAdmin('documents');toast('Dokumen disimpan.')}
async function deleteDocument(id){if(!confirm('Padam dokumen ini?'))return;let x=state.documents.find(v=>v.id===id);if(x?.storage_path)await sb.storage.from(x.bucket_name||'public-documents').remove([x.storage_path]);let r=await sb.from('documents').delete().eq('id',id);if(r.error)return toast(r.error.message);state.documents=await safeLoad('documents','created_at');renderAdmin('documents')}
let actCrop={images:[]};function adminActivities(){return `<button class="btn" onclick="editActivity()">Tambah Aktiviti</button><div class="list">${state.activities.map(x=>`<div class="list-item"><span><b>${esc(x.title)}</b> · ${esc(x.start_date)}</span><span><button class="btn secondary" onclick='editActivity(${JSON.stringify(x)})'>Edit</button> <button class="btn danger" onclick="deleteActivity('${x.id}')">Padam</button></span></div>`).join('')}</div><div id="activityEditor"></div>`}
function editActivity(x){let photos=x?state.activityPhotos.filter(p=>p.activity_id===x.id):[];activityEditor.innerHTML=`<div class="card section" style="margin-top:12px"><div class="admin-grid"><label class="field">Tajuk<input id="actTitle" class="input" value="${esc(x?.title||'')}"></label><label class="field">Tarikh Mula<input id="actDate" class="input" type="date" value="${x?.start_date||''}"></label><label class="field full">Perincian<textarea id="actDesc" class="input">${esc(x?.description||'')}</textarea></label><label class="field full">Tambah Gambar, maksimum 4<input id="actFiles" class="input" type="file" accept="image/*" multiple onchange="prepareActivityPhotos(this.files,${photos.length})"></label><div id="actPreview" class="activity-gallery full">${photos.map(p=>`<img src="${esc(activityPhotoUrl(p))}">`).join('')}</div><label class="field">Aktif<input id="actActive" type="checkbox" ${x?.active===false?'':'checked'}></label><div class="full"><button class="btn" onclick='saveActivity(${x?JSON.stringify(x):'null'})'>Simpan</button></div></div></div>`;actCrop={images:[]}}
async function prepareActivityPhotos(files,existing){actPreview.innerHTML=actPreview.innerHTML; let arr=[...files].slice(0,Math.max(0,4-existing));actCrop.images=[];for(let f of arr){let img=await loadImageFile(f),blob=await cropCenter43(img);actCrop.images.push({blob,name:f.name});let url=URL.createObjectURL(blob);actPreview.insertAdjacentHTML('beforeend',`<img src="${url}">`)}}
function loadImageFile(f){return new Promise((res,rej)=>{let i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)})}
function cropCenter43(img){let c=document.createElement('canvas');c.width=1200;c.height=900;let g=c.getContext('2d'),sr=4/3,ir=img.width/img.height,sx=0,sy=0,sw=img.width,sh=img.height;if(ir>sr){sw=img.height*sr;sx=(img.width-sw)/2}else{sh=img.width/sr;sy=(img.height-sh)/2}g.drawImage(img,sx,sy,sw,sh,0,0,1200,900);return new Promise(r=>c.toBlob(r,'image/jpeg',.88))}
async function saveActivity(x){if(!actTitle.value.trim()||!actDate.value)return toast('Tajuk dan tarikh diperlukan.');let row={title:actTitle.value.trim(),description:actDesc.value.trim(),start_date:actDate.value,active:actActive.checked,updated_by:state.user.id},id=x?.id;if(id){let r=await sb.from('activities').update(row).eq('id',id);if(r.error)return toast(r.error.message)}else{row.created_by=state.user.id;let {data,error}=await sb.from('activities').insert(row).select('id').single();if(error)return toast(error.message);id=data.id}let existing=state.activityPhotos.filter(p=>p.activity_id===id).length;let remaining=Math.max(0,4-existing);for(let [i,f] of actCrop.images.slice(0,remaining).entries()){let path=`${id}/${Date.now()}-${i}.jpg`,u=await sb.storage.from('activity-photos').upload(path,f.blob,{contentType:'image/jpeg'});if(u.error)return toast(u.error.message);await sb.from('activity_photos').insert({activity_id:id,storage_path:path,display_order:existing+i+1})}state.activities=await safeLoad('activities','start_date');state.activityPhotos=await safeLoad('activity_photos','display_order');renderAdmin('activities');toast('Aktiviti disimpan.')}
async function deleteActivity(id){if(!confirm('Padam aktiviti dan semua gambarnya?'))return;let photos=state.activityPhotos.filter(p=>p.activity_id===id);if(photos.length)await sb.storage.from('activity-photos').remove(photos.map(p=>p.storage_path));let r=await sb.from('activities').delete().eq('id',id);if(r.error)return toast(r.error.message);state.activities=await safeLoad('activities','start_date');state.activityPhotos=await safeLoad('activity_photos','display_order');renderAdmin('activities')}
function adminKhairatMessage(){return `<div class="notice">Gunakan toolbar pautan untuk memastikan URL, e-mel dan telefon boleh diklik.</div><div class="admin-subtabs"><button class="btn secondary" onclick="richLink('URL')">Tambah Pautan</button><button class="btn secondary" onclick="document.execCommand('bold')">Tebal</button><button class="btn secondary" onclick="document.execCommand('insertUnorderedList')">Senarai</button></div><div id="khairatEditor" class="rich-editor" contenteditable="true">${safeRich(state.khairatNotFound||'Keahlian anda tidak dijumpai, sila muat turun borang melalui <a href="http://www.abc.com/xyz.pdf">pautan ini</a> dan hantarkan kepada <a href="mailto:email@company.com">email@company.com</a> atau berhubung dengan Nama di talian <a href="tel:01234567890">01234567890</a>.')}</div><button class="btn" style="margin-top:10px" onclick="saveKhairatMessage()">Simpan Mesej</button>`}
function richLink(){let u=prompt('Masukkan URL, mailto: atau tel:');if(u)document.execCommand('createLink',false,u)}
async function saveKhairatMessage(){let html=safeRich(khairatEditor.innerHTML),r=await sb.from('site_settings').upsert({setting_key:'khairat_not_found',setting_value:{html},updated_by:state.user.id},{onConflict:'setting_key'});if(r.error)return toast(r.error.message);state.khairatNotFound=html;toast('Mesej disimpan.')}
async function adminLogout(){await sb.auth.signOut();state.user=null;state.profile=null;loginView()}
function subscribe(){['announcements','islamic_events','organization_members','media_items','funds','page_settings','site_settings','documents','activities','activity_photos'].forEach(t=>sb.channel('rt-'+t).on('postgres_changes',{event:'*',schema:'public',table:t},()=>loadAll()).subscribe())}
setInterval(()=>{if(state.page==='home')render()},1000);setInterval(()=>{if(state.media.length){state.slide++;if(state.page==='home')render()}},10000);
(async()=>{let initial=decodeURIComponent(location.hash.replace(/^#/,''))||'home';if(pages.some(x=>x[0]===initial))state.page=initial;let {data}=await sb.auth.getSession();state.user=data.session?.user||null;state.prayers=fallbackPrayers;await Promise.all([loadAll(),loadPrayer()]);if(localStorage.getItem('hideMenu')==='1'){document.getElementById('nav')?.classList.add('hidden')} subscribe()})();
</script>
