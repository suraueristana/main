<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengurusan Aset Surau</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/lib/browser.min.js"></script><script src="asset-config.js"></script>
<style>:root{--p:#098c5a;--g:#efc75e;--bg:#071812;--card:#0d2a20;--text:#f4fff8;--muted:#a9c8b7;--line:#ffffff1b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Segoe UI,Arial}.top{position:sticky;top:0;z-index:5;background:#081d17ee;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px}.top img{width:62px;height:52px;object-fit:contain;background:#fff;border-radius:10px}.top h1{margin:0;color:var(--g);font-size:1.35rem}.top small{color:var(--muted)}.grow{flex:1}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--p);color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#ffffff12;border:1px solid var(--line)}.btn.warn{background:#c98400}.btn.bad{background:#c33131}.wrap{max-width:1500px;margin:auto;padding:18px}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:15px}.nav button.on{background:var(--g);color:#17281f}.card{background:linear-gradient(145deg,#0b251b,#103328);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.kpi b{font-size:1.8rem;color:var(--g)}.field{display:flex;flex-direction:column;gap:5px}.input{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:#ffffff0b;color:var(--text)}select option{background:#123427}.full{grid-column:1/-1}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.table{width:100%;border-collapse:collapse;min-width:1050px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left}.scroll{overflow:auto}.pill{padding:4px 8px;border-radius:99px;background:#ffffff12}.notice{padding:11px;border-radius:10px;background:#5b410f;color:#fff0c2}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000c;z-index:20;padding:20px;overflow:auto}.modalbox{max-width:1000px;margin:auto;background:#0c251c;border-radius:16px;padding:18px}.qrlabel{width:45mm;height:30mm;background:white;color:#111;border:1px solid #222;padding:2.5mm;display:grid;grid-template-columns:20mm 1fr;gap:2mm;align-items:center;page-break-inside:avoid}.qrlabel canvas{max-width:20mm!important;max-height:20mm!important}.qrtext b{font-size:10pt}.qrtext div{font-size:8pt;margin-top:2mm}.labelgrid{display:grid;grid-template-columns:repeat(3,45mm);gap:4mm}.login{max-width:420px;margin:8vh auto}.dangertext{color:#ff9b9b}@media(max-width:900px){.g4,.g2{grid-template-columns:1fr 1fr}}@media(max-width:600px){.g4,.g2{grid-template-columns:1fr}}@media print{body{background:#fff}.top,.nav,.no-print{display:none!important}.wrap{max-width:none;padding:0}.card{background:#fff;color:#000;border:0}.labelgrid{grid-template-columns:repeat(3,45mm);gap:4mm}.qrlabel{display:grid}}</style></head>
<body><header class="top"><img src="logo.png" onerror="this.style.display='none'"><div><h1>PENGURUSAN ASET & INVENTORI</h1><small>Surau Ar-Raudhah Eristana</small></div><div class="grow"></div><span id="who"></span><a class="btn alt" href="https://suraueristana.github.io/main/" style="text-decoration:none">Portal Utama</a><button class="btn alt" onclick="logout()">Log Keluar</button></header><main class="wrap"><div id="login" class="login card"><h2>Log Masuk Pentadbir</h2><label class="field">E-mel<input id="email" class="input" type="email"></label><label class="field" style="margin-top:10px">Kata laluan<input id="pass" class="input" type="password"></label><button class="btn" style="width:100%;margin-top:12px" onclick="login()">Log Masuk</button><p id="loginmsg" class="dangertext"></p></div><div id="app" class="hidden"><nav class="nav no-print" id="nav"></nav><section id="view"></section></div></main><div id="modal" class="modal hidden"><div class="modalbox"><div class="row"><h2 id="mtitle" class="grow"></h2><button class="btn alt" onclick="closeModal()">Tutup</button></div><div id="mbody"></div></div></div>
<script>
const C=window.ASET_CONFIG,sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY);let S={user:null,role:null,assets:[],cats:[],locs:[],outs:[],inspections:[]};
const tabs=[['dashboard','Papan Pemuka'],['assets','Daftar Aset'],['checkout','Daftar Keluar'],['checkin','Daftar Masuk'],['inspection','Semakan Suku Tahun'],['bulk','Import Pukal'],['qr','QR & Label'],['reports','Laporan'],['settings','Tetapan']];let tab='dashboard'; const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(x){alert(x)} function closeModal(){document.getElementById('modal').classList.add('hidden')} function fmt(d){return d?new Date(d).toLocaleString('ms-MY'):'-'}
async function login(){let {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('pass').value});if(error){document.getElementById('loginmsg').textContent=error.message;return}S.user=data.user;await boot()}
async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){let {data:{session}}=await sb.auth.getSession();if(!session)return;S.user=session.user;let {data:r}=await sb.from('asset_user_roles').select('role,active').eq('user_id',S.user.id).maybeSingle();if(!r?.active){document.getElementById('loginmsg').textContent='Akaun belum diberikan peranan aset.';await sb.auth.signOut();return}S.role=r.role;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=S.user.email+' · '+r.role;await load();renderNav();show(tab)}
async function load(){let [a,c,l,o,i]=await Promise.all([sb.from('assets').select('*,asset_categories(category_name,subcategory_name),asset_locations!assets_current_location_id_fkey(location_name)').order('asset_id'),sb.from('asset_categories').select('*').eq('active',true).order('category_name'),sb.from('asset_locations').select('*').eq('active',true).order('location_name'),sb.from('asset_checkouts').select('*,assets(asset_id,asset_name)').is('checked_in_at',null).order('checkout_at',{ascending:false}),sb.from('asset_inspections').select('*').order('created_at',{ascending:false})]);for(let x of [a,c,l,o,i])if(x.error)throw x.error;S.assets=a.data||[];S.cats=c.data||[];S.locs=l.data||[];S.outs=o.data||[];S.inspections=i.data||[]}
function renderNav(){document.getElementById('nav').innerHTML=tabs.map(x=>`<button class="btn alt ${tab===x[0]?'on':''}" onclick="show('${x[0]}')">${x[1]}</button>`).join('')}
function show(t){tab=t;renderNav();document.getElementById('view').innerHTML=t==='dashboard'?dashboard():t==='assets'?assetsPage():t==='checkout'?checkoutPage():t==='checkin'?checkinPage():t==='inspection'?inspectionPage():t==='bulk'?bulkPage():t==='qr'?qrPage():t==='reports'?reportsPage():settingsPage();if(t==='qr')setTimeout(drawAllQR,50)}
function dashboard(){let n=S.assets.length,a=S.assets.filter(x=>x.status==='TERSEDIA').length,o=S.outs.length,over=S.outs.filter(x=>new Date(x.expected_return_at)<new Date()).length,m=S.assets.filter(x=>['PEMERIKSAAN','PENYELENGGARAAN','ROSAK'].includes(x.status)).length;return `<div class="grid g4">${[['Jumlah Aset',n],['Tersedia',a],['Di Luar Stor',o],['Lewat Pulang',over],['Perlu Tindakan',m]].map(x=>`<div class="card kpi"><span>${x[0]}</span><br><b>${x[1]}</b></div>`).join('')}</div><div class="card"><h2>Aset Di Luar Stor</h2>${openTable(S.outs)}</div>`}
function openTable(rows){return `<div class="scroll"><table class="table"><thead><tr><th>ID</th><th>Aset</th><th>Peminjam</th><th>Destinasi</th><th>Keluar</th><th>Jangka Pulang</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${e(x.assets?.asset_id)}</td><td>${e(x.assets?.asset_name)}</td><td>${e(x.borrower_name)}</td><td>${e(x.destination)}</td><td>${fmt(x.checkout_at)}</td><td>${fmt(x.expected_return_at)}</td></tr>`).join('')}</tbody></table></div>`}
function assetsPage(){return `<div class="row no-print"><input id="find" class="input" style="max-width:420px" placeholder="Cari ID, nama, siri atau lokasi" oninput="filterAssets()"><button class="btn" onclick="editAsset()">Tambah Aset</button><button class="btn alt" onclick="exportAssets()">Eksport CSV</button></div><div class="card scroll"><table class="table"><thead><tr><th>ID</th><th>Nama</th><th>Kategori</th><th>Jenis Kawalan</th><th>Lokasi</th><th>Status</th><th>Keadaan</th><th>Tindakan</th></tr></thead><tbody id="assetRows">${assetRows(S.assets)}</tbody></table></div>`}
function assetRows(rows){return rows.map(x=>`<tr><td><b>${e(x.asset_id)}</b></td><td>${e(x.asset_name)}</td><td>${e(x.asset_categories?.category_name)}</td><td>${e(x.control_type)}</td><td>${e(x.asset_locations?.location_name)}</td><td><span class="pill">${e(x.status)}</span></td><td>${e(x.condition)}</td><td><button class="btn alt" onclick="editAsset('${x.id}')">Edit</button></td></tr>`).join('')}
function filterAssets(){let q=document.getElementById('find').value.toLowerCase();document.getElementById('assetRows').innerHTML=assetRows(S.assets.filter(x=>JSON.stringify(x).toLowerCase().includes(q)))}
function catOpts(v){return S.cats.map(x=>`<option value="${x.id}" ${x.id===v?'selected':''}>${e(x.category_name)} · ${e(x.subcategory_name)}</option>`).join('')}function locOpts(v){return S.locs.map(x=>`<option value="${x.id}" ${x.id===v?'selected':''}>${e(x.location_name)}</option>`).join('')}
function editAsset(id){let x=S.assets.find(a=>a.id===id)||{};document.getElementById('mtitle').textContent=id?'Kemas Kini Aset':'Tambah Aset';document.getElementById('mbody').innerHTML=`<div class="grid g2"><label class="field">ID Aset<input id="f_id" class="input" value="${e(x.asset_id||'')}"></label><label class="field">Nama Aset<input id="f_name" class="input" value="${e(x.asset_name||'')}"></label><label class="field">Kategori<select id="f_cat" class="input">${catOpts(x.category_id)}</select></label><label class="field">Jenis Kawalan<select id="f_control" class="input">${['REKOD_SAHAJA','ASET_INDIVIDU','KUANTITI','BOLEH_DIPINJAM','BOLEH_DISEWA','PINJAM_DAN_SEWA','STOK_GUNA_HABIS'].map(v=>`<option ${x.control_type===v?'selected':''}>${v}</option>`)}</select></label><label class="field">Jenama<input id="f_brand" class="input" value="${e(x.brand||'')}"></label><label class="field">Model<input id="f_model" class="input" value="${e(x.model||'')}"></label><label class="field">No. Siri<input id="f_serial" class="input" value="${e(x.serial_number||'')}"></label><label class="field">Tarikh Perolehan<input id="f_date" type="date" class="input" value="${x.acquisition_date||''}"></label><label class="field">Kos Perolehan (RM)<input id="f_cost" type="number" step="0.01" class="input" value="${x.acquisition_cost||0}"></label><label class="field">Lokasi Asal<select id="f_default" class="input">${locOpts(x.default_location_id)}</select></label><label class="field">Lokasi Semasa<select id="f_current" class="input">${locOpts(x.current_location_id)}</select></label><label class="field">Keadaan<select id="f_cond" class="input">${['BAIK','MEMUASKAN','PERLU_PEMBAIKAN','ROSAK','HILANG'].map(v=>`<option ${x.condition===v?'selected':''}>${v}</option>`)}</select></label><label class="field">Status<select id="f_status" class="input">${['TERSEDIA','DITEMPAH','PEMERIKSAAN','PENYELENGGARAAN','ROSAK','HILANG','DILUPUSKAN','HAPUS_KIRA','TIDAK_AKTIF'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`)}</select></label><label><input id="f_loan" type="checkbox" ${x.loanable?'checked':''}> Boleh dipinjam</label><label><input id="f_rent" type="checkbox" ${x.rentable?'checked':''}> Boleh disewa</label><label class="field">Kadar Sewa (RM)<input id="f_rate" type="number" step="0.01" class="input" value="${x.rental_rate||0}"></label><label class="field">Deposit (RM)<input id="f_dep" type="number" step="0.01" class="input" value="${x.deposit_required||0}"></label><label class="field full">Catatan<textarea id="f_notes" class="input">${e(x.remarks||'')}</textarea></label><button class="btn full" onclick="saveAsset('${x.id||''}')">Simpan</button></div>`;document.getElementById('modal').classList.remove('hidden')}
async function saveAsset(id){let row={asset_id:f_id.value.trim(),asset_name:f_name.value.trim(),category_id:f_cat.value,control_type:f_control.value,brand:f_brand.value,model:f_model.value,serial_number:f_serial.value,acquisition_date:f_date.value||null,acquisition_cost:+f_cost.value||0,default_location_id:f_default.value,current_location_id:f_current.value,condition:f_cond.value,status:f_status.value,loanable:f_loan.checked,rentable:f_rent.checked,rental_rate:+f_rate.value||0,deposit_required:+f_dep.value||0,remarks:f_notes.value,active:f_status.value!=='TIDAK_AKTIF',updated_by:S.user.id};if(!id)row.created_by=S.user.id;let r=id?await sb.from('assets').update(row).eq('id',id):await sb.from('assets').insert(row);if(r.error)return msg(r.error.message);closeModal();await load();show('assets')}
function checkoutPage(){let opts=S.assets.filter(x=>x.status==='TERSEDIA'&&(x.loanable||x.rentable)).map(x=>`<option value="${x.id}">${e(x.asset_id)} · ${e(x.asset_name)}</option>`);return `<div class="card"><h2>Daftar Keluar Aset</h2><div class="grid g2"><label class="field">Aset<select id="co_asset" class="input">${opts}</select></label><label class="field">Jenis<select id="co_type" class="input">${['PINJAMAN_DALAMAN','PINJAMAN_LUARAN','SEWAAN','TUGASAN_ACARA','PINDAHAN_SEMENTARA'].map(v=>`<option>${v}</option>`)}</select></label><label class="field">Nama Peminjam<input id="co_name" class="input"></label><label class="field">No. IC / Organisasi<input id="co_id" class="input"></label><label class="field">Telefon<input id="co_phone" class="input"></label><label class="field">Alamat / Organisasi<input id="co_org" class="input"></label><label class="field">Tujuan / Acara<input id="co_purpose" class="input"></label><label class="field">Destinasi<input id="co_dest" class="input"></label><label class="field">Jangka Pulang<input id="co_expected" type="datetime-local" class="input"></label><label class="field">Keadaan Keluar<select id="co_cond" class="input"><option>BAIK</option><option>MEMUASKAN</option><option>PERLU_PEMBAIKAN</option></select></label><label class="field full">Aksesori<input id="co_acc" class="input"></label><label class="field">Sewa (RM)<input id="co_rental" type="number" class="input" value="0"></label><label class="field">Deposit (RM)<input id="co_deposit" type="number" class="input" value="0"></label><button class="btn full" onclick="doCheckout()">Sahkan Daftar Keluar</button></div></div>`}
async function doCheckout(){let {error}=await sb.rpc('checkout_asset',{p_asset:co_asset.value,p_type:co_type.value,p_borrower:co_name.value,p_id:co_id.value,p_phone:co_phone.value,p_org:co_org.value,p_purpose:co_purpose.value,p_destination:co_dest.value,p_expected:new Date(co_expected.value).toISOString(),p_condition:co_cond.value,p_accessories:co_acc.value,p_rental:+co_rental.value||0,p_deposit:+co_deposit.value||0});if(error)return msg(error.message);msg('Daftar keluar berjaya.');await load();show('dashboard')}
function checkinPage(){return `<div class="card"><h2>Daftar Masuk Aset</h2><div class="grid g2"><label class="field full">Transaksi Aktif<select id="ci_tx" class="input">${S.outs.map(x=>`<option value="${x.id}">${e(x.assets?.asset_id)} · ${e(x.assets?.asset_name)} · ${e(x.borrower_name)}</option>`)}</select></label><label class="field">Keadaan Pulang<select id="ci_cond" class="input">${['BAIK','MEMUASKAN','PERLU_PEMBAIKAN','ROSAK','HILANG'].map(v=>`<option>${v}</option>`)}</select></label><label class="field">Lokasi Pulang<select id="ci_loc" class="input">${locOpts()}</select></label><label class="field full">Aksesori Dipulangkan<input id="ci_acc" class="input"></label><label class="field full">Catatan Pulangan<textarea id="ci_notes" class="input"></textarea></label><label class="field">Deposit Dipulangkan (RM)<input id="ci_refund" type="number" value="0" class="input"></label><label class="field">Potongan Deposit (RM)<input id="ci_ded" type="number" value="0" class="input"></label><button class="btn full" onclick="doCheckin()">Sahkan Daftar Masuk</button></div></div>`}
async function doCheckin(){let {error}=await sb.rpc('checkin_asset',{p_checkout:ci_tx.value,p_condition:ci_cond.value,p_accessories:ci_acc.value,p_notes:ci_notes.value,p_refund:+ci_refund.value||0,p_deduction:+ci_ded.value||0,p_location:ci_loc.value});if(error)return msg(error.message);msg('Daftar masuk berjaya.');await load();show('dashboard')}
function inspectionPage(){return `<div class="card"><h2>Cipta Semakan Aset</h2><div class="grid g2"><label class="field">Nama Semakan<input id="in_name" class="input" placeholder="Contoh: Semakan Aset Suku 3 2026"></label><label class="field">Tarikh Semakan<input id="in_date" type="date" class="input"></label><label class="field">Skop Lokasi<select id="in_loc" class="input"><option value="">Semua Lokasi</option>${locOpts()}</select></label><button class="btn" onclick="startInspection()">Cipta Snapshot</button></div></div><div class="card scroll"><table class="table"><thead><tr><th>Nama</th><th>Tarikh Semakan</th><th>Status</th><th>Tindakan</th></tr></thead><tbody>${S.inspections.map(x=>`<tr><td>${e(x.inspection_name)}</td><td>${e(x.cutoff_date)}</td><td>${e(x.status)}</td><td><button class="btn alt" onclick="openInspection('${x.id}')">Buka</button></td></tr>`).join('')}</tbody></table></div>`}
async function startInspection(){let {error}=await sb.rpc('start_asset_inspection',{p_name:in_name.value,p_cutoff:in_date.value,p_location:in_loc.value||null,p_checker:S.user.id});if(error)return msg(error.message);await load();show('inspection')}
async function openInspection(id){let {data,error}=await sb.from('asset_inspection_lines').select('*,assets(asset_id,asset_name),asset_locations!asset_inspection_lines_expected_location_id_fkey(location_name)').eq('inspection_id',id).order('verified_at',{ascending:true});if(error)return msg(error.message);document.getElementById('mtitle').textContent='Butiran Semakan';document.getElementById('mbody').innerHTML=`<div class="scroll"><table class="table"><thead><tr><th>Aset</th><th>Lokasi Jangkaan</th><th>Keputusan</th><th>Tindakan</th></tr></thead><tbody>${data.map(x=>`<tr><td>${e(x.assets?.asset_id)}<br>${e(x.assets?.asset_name)}</td><td>${e(x.asset_locations?.location_name)}</td><td>${e(x.result||'BELUM DISEMAK')}</td><td><button class="btn alt" onclick="verifyLine('${x.id}','${id}')">Semak</button></td></tr>`).join('')}</tbody></table></div>`;document.getElementById('modal').classList.remove('hidden')}
function verifyLine(line,inspection){let result=prompt('Keputusan: DITEMUI_TEPAT / LOKASI_BERBEZA / PENJAGA_BERBEZA / ROSAK / TIDAK_DITEMUI / SEDANG_DIPINJAM / ASET_TANPA_LABEL / MENUNGGU_PELUPUSAN','DITEMUI_TEPAT');if(!result)return;let action=prompt('Tindakan pembetulan (jika ada)','');sb.from('asset_inspection_lines').update({verified_at:new Date().toISOString(),verified_by:S.user.id,result,corrective_action:action}).eq('id',line).then(r=>{if(r.error)msg(r.error.message);else openInspection(inspection)})}
function bulkPage(){return `<div class="card"><h2>Import Penyelenggaraan Pukal</h2><div class="notice">Gunakan CSV daripada templat Excel. Import hanya mencipta atau mengemas kini data induk aset. Transaksi pinjaman, pulangan dan sejarah pemeriksaan tidak diubah.</div><input id="csvfile" type="file" accept=".csv,text/csv" class="input" style="margin-top:12px"><button class="btn" style="margin-top:10px" onclick="bulkImport()">Semak & Import</button><pre id="bulklog"></pre></div>`}
function parseCSV(t){let rows=[],r=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'&&t[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);if(r.some(x=>x.trim()))rows.push(r);r=[];v=''}else v+=c}r.push(v);if(r.some(x=>x.trim()))rows.push(r);return rows}
async function bulkImport(){let f=document.getElementById('csvfile').files[0];if(!f)return msg('Pilih fail CSV.');let rows=parseCSV(await f.text()),h=rows.shift().map(x=>x.trim()),required=['action','asset_id','asset_name','category','subcategory','control_type','default_location','current_location','condition','status','loanable','rentable','active'];let miss=required.filter(x=>!h.includes(x));if(miss.length)return msg('Kolum tiada: '+miss.join(', '));let logs=[],ok=0;for(let [idx,a] of rows.entries()){let o=Object.fromEntries(h.map((k,i)=>[k,(a[i]||'').trim()]));try{let cat=S.cats.find(x=>x.category_name===o.category&&x.subcategory_name===o.subcategory),dl=S.locs.find(x=>x.location_name===o.default_location||x.location_code===o.default_location),cl=S.locs.find(x=>x.location_name===o.current_location||x.location_code===o.current_location);if(!cat||!dl||!cl)throw Error('Kategori atau lokasi tidak sah');let data={asset_id:o.asset_id,asset_name:o.asset_name,category_id:cat.id,control_type:o.control_type,quantity:+o.quantity||1,uom:o.uom||'UNIT',brand:o.brand||null,model:o.model||null,serial_number:o.serial_number||null,acquisition_date:o.acquisition_date||null,acquisition_cost:+o.acquisition_cost||0,funding_source:o.funding_source||null,supplier_donor:o.supplier_donor||null,ownership:o.ownership||'SURAU',default_location_id:dl.id,current_location_id:cl.id,current_custodian:o.current_custodian||null,condition:o.condition,status:o.status,loanable:o.loanable==='YA',rentable:o.rentable==='YA',rental_rate:+o.rental_rate||0,deposit_required:+o.deposit_required||0,warranty_expiry:o.warranty_expiry||null,remarks:o.remarks||null,active:o.active==='YA',updated_by:S.user.id};let r;if(o.action==='CREATE')r=await sb.from('assets').insert({...data,created_by:S.user.id});else if(['UPDATE','MOVE','INACTIVATE','DISPOSE'].includes(o.action)){if(o.action==='INACTIVATE'){data.active=false;data.status='TIDAK_AKTIF'}if(o.action==='DISPOSE'){data.active=false;data.status='DILUPUSKAN'}r=await sb.from('assets').update(data).eq('asset_id',o.asset_id)}else throw Error('Tindakan tidak sah');if(r.error)throw r.error;ok++}catch(err){logs.push(`Baris ${idx+2}: ${err.message}`)}}document.getElementById('bulklog').textContent=`Berjaya: ${ok}\nGagal: ${logs.length}\n`+logs.join('\n');await load()}
function qrPage(){return `<div class="no-print row"><select id="qrfilter" class="input" style="max-width:300px" onchange="show('qr')"><option value="ALL">Semua aset aktif</option></select><button class="btn" onclick="window.print()">Cetak Label</button></div><div class="card"><div class="labelgrid">${S.assets.filter(x=>x.active).map(x=>`<div class="qrlabel"><canvas id="q_${x.id}"></canvas><div class="qrtext"><b>${e(x.asset_id)}</b><div>${e(x.asset_name)}</div></div></div>`).join('')}</div></div>`}
function drawAllQR(){S.assets.filter(x=>x.active).forEach(x=>{let cv=document.getElementById('q_'+x.id);if(cv)QRCode.toCanvas(cv,`${C.PUBLIC_ASSET_URL}?asset=${encodeURIComponent(x.asset_id)}`,{width:160,margin:1})})}
function reportsPage(){return `<div class="card"><h2>Laporan Operasi</h2><div class="row no-print"><button class="btn" onclick="exportAssets()">Daftar Aset CSV</button><button class="btn alt" onclick="exportOpen()">Aset Di Luar CSV</button><button class="btn alt" onclick="window.print()">Cetak Paparan</button></div></div><div class="card"><h3>Aset Di Luar</h3>${openTable(S.outs)}</div>`}
function csvDownload(name,rows){let t=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),b=new Blob(['\ufeff'+t],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function exportAssets(){csvDownload('daftar_aset.csv',[['asset_id','asset_name','category','control_type','location','status','condition'],...S.assets.map(x=>[x.asset_id,x.asset_name,x.asset_categories?.category_name,x.control_type,x.asset_locations?.location_name,x.status,x.condition])])}function exportOpen(){csvDownload('aset_di_luar.csv',[['asset_id','asset_name','borrower','destination','checkout_at','expected_return_at'],...S.outs.map(x=>[x.assets?.asset_id,x.assets?.asset_name,x.borrower_name,x.destination,x.checkout_at,x.expected_return_at])])}
function settingsPage(){return `<div class="grid g2"><div class="card"><h2>Kategori</h2>${S.cats.map(x=>`<div>${e(x.category_name)} · ${e(x.subcategory_name)}</div>`).join('')}</div><div class="card"><h2>Lokasi</h2>${S.locs.map(x=>`<div>${e(x.location_code)} · ${e(x.location_name)}</div>`).join('')}</div></div>`}
window.addEventListener('DOMContentLoaded',()=>boot().catch(x=>{const m=document.getElementById('loginmsg');if(m)m.textContent=x.message;console.error(x)}));
</script></body></html>
