<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semakan Aset Surau</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="asset-config.js"></script><style>body{margin:0;background:#071812;color:#f5fff9;font:16px Segoe UI,Arial}.box{max-width:650px;margin:8vh auto;padding:24px;background:#0d2a20;border:1px solid #ffffff20;border-radius:20px;text-align:center}img{width:100px;background:#fff;border-radius:12px}h1{color:#efc75e}.id{font-size:1.5rem;color:#59e5a5}.status{display:inline-block;padding:8px 14px;border-radius:99px;background:#ffffff12}</style></head><body><main class="box"><img src="logo.png" onerror="this.style.display='none'"><h1>ASET SURAU AR-RAUDHAH ERISTANA</h1><div id="out">Memuatkan...</div></main><script>const sb=supabase.createClient(ASET_CONFIG.SUPABASE_URL,ASET_CONFIG.SUPABASE_KEY),id=new URLSearchParams(location.search).get('asset'),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{if(!id){out.innerHTML='<p>ID aset tidak diberikan.</p>';return}let{data,error}=await sb.from('public_asset_lookup').select('*').eq('asset_id',id).maybeSingle();if(error||!data){out.innerHTML='<p>Rekod aset tidak ditemui.</p>';return}out.innerHTML=`<p class="id"><b>${e(data.asset_id)}</b></p><h2>${e(data.asset_name)}</h2><p><span class="status">${e(data.status)}</span></p><p>Keadaan: <b>${e(data.condition)}</b></p><p>Jika aset ini ditemui di luar kawalan surau, sila hubungi pihak pengurusan Surau Ar-Raudhah Eristana.</p>`})();</script></body></html>
